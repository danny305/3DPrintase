[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "3DPrintase"
version = "1.3.0"
description = "Reproducible molecule-to-printable-OBJ pipeline using RDKit and Jmol"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "trimesh>=4.4,<5",
  "rdkit>=2025.3,<2026",
  "glyles>=1.2,<2",
  "dimorphite-dl>=2.0.2,<3",
]

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=6"]

[project.scripts]
3dprintase = "printase3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
printase3d = ["jmol/*.spt", "jmol/*.txt"]
