name: Python tests and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Offline unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Install wheel outside the source environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/3dprintase" --version
          "$RUNNER_TEMP/wheel-env/bin/3dprintase" molecule --smiles CCO --label ethanol --no-render --output wheel-smoke
          "$RUNNER_TEMP/wheel-env/bin/python" -c "from importlib.resources import files; assert files('printase3d').joinpath('jmol/3DP-Jmol.pipeline.spt').is_file(); assert files('printase3d').joinpath('jmol/LICENSE-3DP-Jmol.txt').is_file()"
